<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity | Вход</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <!-- Фоновые декоративные элементы -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-cyan-500/20 rounded-full blur-[120px]"></div>
        <div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-fuchsia-500/20 rounded-full blur-[120px]"></div>
    </div>

    <div class="relative w-full max-w-md">
        <!-- Карточка формы -->
        <div class="bg-white/10 backdrop-blur-2xl border border-white/20 p-8 rounded-[2.5rem] shadow-2xl">
            <div class="text-center mb-8">
                <div class="inline-flex w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-400 to-fuchsia-500 shadow-lg shadow-cyan-500/20 items-center justify-center mb-4">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                </div>
                <h1 class="text-3xl font-black italic tracking-tighter uppercase text-white">Вход в <span class="text-cyan-400">Velocity</span></h1>
                <p class="text-slate-400 text-sm mt-2 font-medium">С возвращением, райдер!</p>
            </div>

            <form action="/login" method="post" class="space-y-4">
                <div class="space-y-1">
                    <input type="text" name="username" placeholder="Логин" required 
                           class="w-full px-6 py-4 bg-white/5 border border-white/10 rounded-2xl text-white placeholder-slate-500 outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all">
                </div>
                <div class="space-y-1">
                    <input type="password" name="password" placeholder="Пароль" required 
                           class="w-full px-6 py-4 bg-white/5 border border-white/10 rounded-2xl text-white placeholder-slate-500 outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all">
                </div>
                
                <button type="submit" class="w-full py-4 bg-white text-slate-900 rounded-2xl font-bold uppercase tracking-wider hover:bg-cyan-400 hover:text-white transition-all shadow-xl active:scale-95">
                    Войти
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-white/10 text-center space-y-4">
                <p class="text-slate-400 text-sm">
                    Нет аккаунта? <a href="/register" class="text-cyan-400 font-bold hover:underline">Регистрация</a>
                </p>
                <a href="/" class="inline-block text-xs text-slate-500 hover:text-white transition-colors uppercase tracking-widest font-bold">
                    ← Вернуться к карте
                </a>
            </div>
        </div>
    </div>
</body>
</html>
