<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity | Регистрация</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <!-- Фоновые декоративные элементы -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-[10%] -right-[10%] w-[40%] h-[40%] bg-fuchsia-500/20 rounded-full blur-[120px]"></div>
        <div class="absolute -bottom-[10%] -left-[10%] w-[40%] h-[40%] bg-cyan-500/20 rounded-full blur-[120px]"></div>
    </div>

    <div class="relative w-full max-w-md">
        <div class="bg-white/10 backdrop-blur-2xl border border-white/20 p-8 rounded-[2.5rem] shadow-2xl">
            <div class="text-center mb-8">
                <div class="inline-flex w-16 h-16 rounded-2xl bg-white/5 border border-white/20 items-center justify-center mb-4">
                    <svg class="w-10 h-10 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                </div>
                <h1 class="text-3xl font-black italic tracking-tighter uppercase text-white">Создать <span class="text-fuchsia-500">аккаунт</span></h1>
                <p class="text-slate-400 text-sm mt-2 font-medium">Стань частью велосообщества</p>
            </div>

            <form action="/register" method="post" class="space-y-4">
                <input type="text" name="username" placeholder="Придумайте логин" required 
                    class="w-full px-6 py-4 bg-white/5 border border-white/10 rounded-2xl text-white placeholder-slate-500 outline-none focus:border-fuchsia-500 transition-all">
                
                <input type="password" name="password" placeholder="Надежный пароль" required 
                    class="w-full px-6 py-4 bg-white/5 border border-white/10 rounded-2xl text-white placeholder-slate-500 outline-none focus:border-fuchsia-500 transition-all">

                <!-- Выбор типа аккаунта -->
                <div class="space-y-2">
                    <label class="text-sm text-slate-300 block mb-2">Тип аккаунта</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="flex items-center gap-3 bg-white/5 border border-white/10 rounded-2xl p-4 cursor-pointer hover:border-fuchsia-500 transition-all">
                            <input type="radio" name="account_type" value="user" checked class="accent-fuchsia-500 scale-110">
                            <div>
                                <div class="font-medium text-white">Пользователь</div>
                                <div class="text-xs text-slate-400">Участвую в заездах</div>
                            </div>
                        </label>
                        
                        <label class="flex items-center gap-3 bg-white/5 border border-white/10 rounded-2xl p-4 cursor-pointer hover:border-fuchsia-500 transition-all">
                            <input type="radio" name="account_type" value="community" class="accent-fuchsia-500 scale-110">
                            <div>
                                <div class="font-medium text-white">Велосообщество</div>
                                <div class="text-xs text-slate-400">Организую заезды</div>
                            </div>
                        </label>
                    </div>
                </div>

                <button type="submit" class="w-full py-4 bg-gradient-to-r from-cyan-400 to-fuchsia-500 text-white rounded-2xl font-bold uppercase tracking-wider hover:opacity-90 transition-all shadow-xl">
                    Зарегистрироваться
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-white/10 text-center space-y-4">
                <p class="text-slate-400 text-sm">
                    Уже есть аккаунт? <a href="/login" class="text-fuchsia-500 font-bold hover:underline">Войти</a>
                </p>
                <a href="/" class="inline-block text-xs text-slate-500 hover:text-white transition-colors uppercase tracking-widest font-bold">
                    ← Вернуться к карте
                </a>
            </div>
        </div>
    </div>
</body>
</html>
