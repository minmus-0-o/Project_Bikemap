<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { margin: 0; }
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased text-slate-800">

    <div id="map" class="fixed inset-0 z-0"></div>

    <main class="relative z-10 flex h-screen p-4 pointer-events-none">
        <aside class="w-80 flex flex-col gap-6 p-6 rounded-[2rem] bg-white/70 backdrop-blur-2xl shadow-[0_8px_32px_0_rgba(31,38,135,0.15)] border border-white/40 pointer-events-auto overflow-y-auto">
            
            <!-- Логотип -->
            <div class="flex items-center gap-3 px-2">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-400 to-fuchsia-500 shadow-lg shadow-cyan-500/20 flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
                    </svg>
                </div>
                <span class="text-2xl font-black italic tracking-tighter uppercase text-slate-900">BIKEMAP<span class="text-cyan-500"></span></span>
            </div>

            <hr class="border-slate-200/50">

            <!-- Фильтр по дате -->
            <div class="space-y-2">
                <label class="text-[10px] font-bold uppercase tracking-widest text-slate-400 px-2">Выберите дату</label>
                <input type="date" id="filter-date" onchange="loadRides()" 
                       class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-cyan-400 outline-none transition-all text-sm shadow-sm">
            </div>

            <!-- Фильтр Все / Велосообщества -->
            <div class="space-y-2">
                <label class="text-[10px] font-bold uppercase tracking-widest text-slate-400 px-2">Тип заездов</label>
                <div class="flex bg-white/50 rounded-2xl p-1 border border-slate-200">
                    <button onclick="setFilter(0)" id="btn-all" 
                            class="flex-1 py-3 text-sm font-semibold rounded-xl transition-all bg-white">Все заезды</button>
                    <button onclick="setFilter(1)" id="btn-community" 
                            class="flex-1 py-3 text-sm font-semibold rounded-xl transition-all">Велосообщества</button>
                </div>
            </div>

            <!-- Авторизованный блок -->
            <div id="auth-section" class="hidden flex-1 flex flex-col gap-6">
                <div id="upload-form-container" class="space-y-4 flex-1"></div>

                <!-- Информация о пользователе -->
                <div class="flex items-center gap-3">
                <!-- Аватар -->
                <label for="avatar-upload" class="cursor-pointer group relative flex-shrink-0">
                    <div class="w-14 h-14 rounded-full bg-gradient-to-br from-cyan-400 to-fuchsia-500 p-0.5 shadow-md overflow-hidden ring-2 ring-white">
                        <img id="user-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Gleb" 
                            class="rounded-full w-full h-full object-cover">
                    </div>
                    <div class="absolute -bottom-1 -right-1 bg-cyan-500 text-white text-xs w-6 h-6 rounded-full flex items-center justify-center shadow ring-2 ring-white">✎</div>
                </label>

                <input type="file" id="avatar-upload" accept="image/*" class="hidden" onchange="previewAndUploadAvatar(this)">

                <!-- Имя и роль -->
                <div class="flex-1 min-w-0">
                    <div class="relative pr-2">
                        <span id="user-name" class="text-sm font-bold text-slate-900 block truncate">Загрузка...</span>
                    </div>
                    <span id="user-role" class="text-xs text-slate-400 block truncate"></span>
                </div>

                <!-- Кнопка выхода -->
                <button onclick="logout()" class="...">Выйти</button>
            </div>
            </div>

            <!-- Гость -->
            <div id="guest-section" class="hidden flex-1 flex flex-col justify-center items-center text-center p-6 space-y-6">
                <div class="w-20 h-20 bg-slate-100 rounded-2xl flex items-center justify-center text-slate-400">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
                <div>
                    <p class="text-lg font-semibold text-slate-700">Добро пожаловать!</p>
                    <p class="text-sm text-slate-500 mt-1">Войдите, чтобы добавлять свои маршруты</p>
                </div>
                <div class="w-full space-y-3">
                    <a href="/login" class="block w-full py-4 bg-slate-900 text-white rounded-2xl font-bold">Войти</a>
                    <a href="/register" class="block w-full py-4 bg-white border border-slate-200 text-slate-700 rounded-2xl font-bold">Создать аккаунт</a>
                </div>
            </div>
        </aside>
    </main>

    <script>
        let map, markersGroup, currentTrack;
        let currentFilter = 0;

        function setFilter(mode) {
            currentFilter = mode;
            document.getElementById('btn-all').classList.toggle('bg-white', mode === 0);
            document.getElementById('btn-community').classList.toggle('bg-white', mode === 1);
            loadRides();
        }

        document.addEventListener('DOMContentLoaded', async function() {
            initMap();

            try {
                const response = await fetch('/get_user_info');
                const data = await response.json();

                if (data.error) {
                    document.getElementById('auth-section').classList.add('hidden');
                    document.getElementById('guest-section').classList.remove('hidden');
                } else {
                    document.getElementById('auth-section').classList.remove('hidden');
                    document.getElementById('guest-section').classList.add('hidden');

                    document.getElementById('user-name').textContent = data.username;
                    document.getElementById('user-role').textContent = data.role;
                    document.getElementById('user-avatar').src = data.avatar;

                    const container = document.getElementById('upload-form-container');

                    if (data.role === "Ожидает подтверждения") {
                        container.innerHTML = `
                            <div class="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-6 text-center h-full flex flex-col items-center justify-center">
                                <div class="text-4xl mb-4">⏳</div>
                                <p class="text-amber-600 font-semibold">Ожидает подтверждения</p>
                                <p class="text-slate-500 text-sm mt-2">После одобрения вы сможете публиковать заезды</p>
                            </div>
                        `;
                    } else {
                        container.innerHTML = `
                            <label class="text-[10px] font-bold uppercase tracking-widest text-slate-400 px-2">Добавить трек</label>
                            <form action="/upload_gpx" method="post" enctype="multipart/form-data" class="space-y-3">
                                <input type="text" name="title" placeholder="Название" required class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-2xl text-sm outline-none focus:border-cyan-400 transition-colors">
                                <textarea name="description" placeholder="Описание" class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-2xl text-sm outline-none focus:border-cyan-400 transition-colors resize-none" rows="2"></textarea>
                                <div class="space-y-1">
                                    <label class="text-[10px] font-bold text-slate-400 px-2 uppercase">Файл маршрута (.gpx)</label>
                                    <input type="file" name="gpx_file" accept=".gpx" required class="w-full px-4 py-2 bg-white/50 border border-slate-200 rounded-2xl text-xs file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-cyan-50 file:text-cyan-700 hover:file:bg-cyan-100">
                                </div>
                                <input type="date" name="ride_date" required class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-2xl text-sm outline-none">
                                <button type="submit" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold text-sm shadow-xl hover:bg-cyan-500 transition-all uppercase tracking-wider">
                                    Опубликовать заезд
                                </button>
                            </form>
                        `;
                    }
                }
            } catch (err) {
                console.error(err);
            }

            const today = new Date().toISOString().split('T')[0];
            document.getElementById('filter-date').value = today;
            loadRides();
        });

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([55.75, 37.61], 10);
            L.control.zoom({ position: 'bottomright' }).addTo(map);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            markersGroup = L.layerGroup().addTo(map);

            map.on('click', () => {
                if (currentTrack) {
                    map.removeLayer(currentTrack);
                    currentTrack = null;
                }
            });
        }

        function showTrack(gpxUrl, marker) {
            if (currentTrack) map.removeLayer(currentTrack);

            currentTrack = new L.GPX(gpxUrl, {
                async: true,
                marker_options: { startIconUrl: null, endIconUrl: null, shadowUrl: null },
                polyline_options: { color: '#06b6d4', opacity: 0.85, weight: 5, lineCap: 'round' }
            }).on('loaded', function(e) {
                map.flyToBounds(e.target.getBounds(), {
                    padding: [100, 130],
                    maxZoom: 15,
                    duration: 1.2
                });

                setTimeout(() => {
                    marker.openPopup();
                }, 1100);
            }).addTo(map);
        }

        async function loadRides() {
            const dateInput = document.getElementById('filter-date');
            if (!dateInput.value || !markersGroup) return;

            const url = `/get_rides?date=${dateInput.value}&only_community=${currentFilter === 1}`;
            const response = await fetch(url);
            const rides = await response.json();

            markersGroup.clearLayers();

            rides.forEach(ride => {
                const marker = L.marker([ride.lat, ride.lon]).addTo(markersGroup);

                const popupContent = `
                    <div style="min-width: 180px; max-width: 230px; font-family: system-ui, sans-serif; line-height: 1.4;">
                        <div class="flex items-center gap-2.5 mb-3">
                            <img src="${ride.author_avatar}" class="w-7 h-7 rounded-full object-cover border border-white shadow-sm" alt="">
                            <div class="text-sm font-medium text-slate-800">${ride.author_username}</div>
                        </div>
                        
                        <b style="font-size: 1.1rem; color: #0f172a; display: block; margin-bottom: 4px;">${ride.title}</b>
                        
                        ${ride.length_km ? `<div style="color:#0ea5e9; font-weight:600; margin: 6px 0;">📏 ${ride.length_km} км</div>` : ''}
                        
                        <p style="font-size:0.85rem; color:#475569; margin: 8px 0;">
                            ${ride.description ? ride.description.substring(0, 120) + (ride.description.length > 120 ? '...' : '') : 'Без описания'}
                        </p>
                        
                        <a href="${ride.gpx_path}" download style="text-decoration: none; display: block; margin-bottom: 8px;">
                            <button style="width:100%; padding:10px; background:linear-gradient(to right,#22d3ee,#d946ef); color:white; border:none; border-radius:10px; cursor:pointer; font-weight:600;">
                                ↓ СКАЧАТЬ GPX
                            </button>
                        </a>

                        <!-- Кнопка удаления — теперь всегда видна -->
                        <button onclick="deleteRide(${ride.id})" 
                                style="width:100%; padding:10px; background:#ef4444; color:white; border:none; border-radius:10px; cursor:pointer; font-weight:600;">
                            🗑 Удалить маршрут
                        </button>
                    </div>
                `;

                const popup = L.popup({
                    closeButton: true,
                    autoPan: true,
                    keepInView: true,
                    offset: [0, -10]
                }).setContent(popupContent);

                marker.bindPopup(popup);

                marker.on('click', function() {
                    if (currentTrack) map.removeLayer(currentTrack);
                    showTrack(ride.gpx_path, marker);
                });
            });
        }

        function showTrack(gpxUrl, marker) {
            if (currentTrack) map.removeLayer(currentTrack);

            currentTrack = new L.GPX(gpxUrl, {
                async: true,
                marker_options: { startIconUrl: null, endIconUrl: null, shadowUrl: null },
                polyline_options: { color: '#06b6d4', opacity: 0.85, weight: 5, lineCap: 'round' }
            }).on('loaded', function(e) {
                map.flyToBounds(e.target.getBounds(), {
                    padding: [80, 100],
                    maxZoom: 15,
                    duration: 1
                });

                setTimeout(() => {
                    marker.openPopup();
                    setTimeout(showDeleteButtonIfAllowed, 400);
                }, 800);
            }).addTo(map);
        }

        async function deleteRide(rideId) {
            if (!confirm("Вы уверены, что хотите удалить этот маршрут?\n\nЭто действие нельзя отменить.")) return;

            try {
                const res = await fetch(`/delete_ride/${rideId}`, {
                    method: 'POST',
                    credentials: 'include'
                });
                
                const data = await res.json();
                
                if (data.success) {
                    alert("✅ Маршрут успешно удалён");
                    loadRides();
                } else {
                    alert(data.error || "Ошибка при удалении");
                }
            } catch (err) {
                console.error(err);
                alert("Ошибка соединения с сервером");
            }
        }

        async function showDeleteButtonIfAllowed() {
            const buttons = document.querySelectorAll('.delete-btn');
            if (buttons.length === 0) return;

            try {
                const res = await fetch('/get_user_info', { credentials: 'include' });
                const userData = await res.json();
                
                if (userData.error) return;

                const isAdmin = userData.username === "admin";

                buttons.forEach(btn => {
                    const ownerId = parseInt(btn.dataset.ownerId || 0);
                    if (isAdmin || ownerId === userData.user_id) {
                        btn.style.display = "block";
                    }
                });
            } catch(e) {
                console.error("Не удалось проверить права", e);
            }
        }

        function previewAndUploadAvatar(input) {
            const file = input.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                alert("Файл слишком большой! Максимум 5 МБ.");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('user-avatar').src = e.target.result;
            };
            reader.readAsDataURL(file);

            const formData = new FormData();
            formData.append("avatar", file);

            fetch('/upload_avatar', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (response.ok || response.redirected) {
                    setTimeout(() => window.location.reload(), 800);
                } else {
                    alert("Ошибка при загрузке аватарки");
                }
            })
            .catch(err => {
                console.error("Upload error:", err);
                alert("Ошибка соединения с сервером");
            });
        }

        function logout() {
            document.cookie = "user_id=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            window.location.reload();
        }
    </script>
</body>
</html>
