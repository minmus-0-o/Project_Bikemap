<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <style>
        body {
            margin: 0;
        }
        #map {position: absolute; top: 0; bottom: 0; left: 0; right: 0;}

        .sidebar {
            position: absolute;
            top: 10px; left: 10px; bottom: 50%;
            width: 340px;
            background: #9ffff1;
            z-index: 1000;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 0px 0px 100px 100px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h3>Панель управления</h3>
        <div class="filter-section">
            <h4>Поиск заездов</h4>
            <label>Выберите дату: 
                <input type="date" id="filter-date" onchange="loadRides()">
            </label>
        </div>
        <hr>
        {% if user %}
        <p>Привет <a>{{ user.username }}</a>!</p>
        <a href="/logout"><button>Выйти</button></a>
        <section class="upload-ride">
            <h3>Добавить новый велозаезд</h3>
            <form action="/upload_gpx" method="post" enctype="multipart/form-data">
            <label>Название маршрута: 
                <input type="text" name="title" required>
            </label><br>

            <label>Описание маршрута: 
                <textarea name="description" rows="3"></textarea>
            </label><br>
        
            <label>Дата заезда: 
                <input type="date" name="ride_date" required>
            </label><br>
        
            <label>Выберите GPX файл: 
                <input type="file" name="gpx_file" accept=".gpx" required>
            </label><br>
        
        <button type="submit">Загрузить маршрут</button>
        </form>
        </section>
        {% else %}
        <a href="/register"><button>Зарегистрироваться</button></a>
        <a href="/login"><button>Войти</button></a>
        {% endif %}
    </aside>
    <div id = "map"></div>
    <script>
    var map = L.map('map').setView([55.75, 37.61], 10);
var markersGroup = L.layerGroup().addTo(map);
var currentTrack = null; // Здесь будем хранить текущую линию маршрута

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
}).addTo(map);

map.on('click', function(e) {
    // Проверяем, нажал ли пользователь на карту, а не на маркер 
    // (Leaflet сам управляет всплытием событий, так что это сработает)
    if (currentTrack) {
        map.removeLayer(currentTrack);
        currentTrack = null; // Обнуляем переменную, чтобы скрипт знал, что трека нет
    }
});

async function loadRides() {
    const date = document.getElementById('filter-date').value;
    if (!date) return;

    markersGroup.clearLayers();
    if (currentTrack) map.removeLayer(currentTrack); // Убираем старую линию

    const response = await fetch(`/get_rides?date=${date}`);
    const rides = await response.json();

    rides.forEach(ride => {
    const marker = L.marker([ride.lat, ride.lon]).addTo(markersGroup);

    // Формируем содержимое балуна
    const popupContent = `
        <div style="max-width: 200px">
            <b style="font-size: 1.1em">${ride.title}</b><br>
            <p style="margin-top: 5px; color: #555; font-size: 0.9em;">${ride.description}</p>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">
            <a href="${ride.gpx_path}" download="${ride.title}.gpx" style="text-decoration: none;">
                <button style="width: 100%; cursor: pointer; background-color: #4CAF50; color: white; border: none; padding: 5px; border-radius: 4px;">
                    Скачать маршрут
                </button>
            </a>
        </div>
    `;

    marker.bindPopup(popupContent);

    marker.on('click', function() {
        showTrack(ride.gpx_path);
    });
});
}

function showTrack(gpxUrl) {
    // Если на карте уже есть линия — удаляем её
    if (currentTrack) {
        map.removeLayer(currentTrack);
    }

    // Рисуем новую линию из файла
    currentTrack = new L.GPX(gpxUrl, {
        async: true,
        marker_options: {
            startIconUrl: '', // Прячем стандартные иконки плагина, 
            endIconUrl: '',   // чтобы не дублировать наш маркер
            shadowUrl: ''
        },
        polyline_options: {
            color: 'red',
            weight: 5,
            opacity: 0.7
        }
    }).on('loaded', function(e) {
        map.fitBounds(e.target.getBounds()); // Автоматически приближаем карту к маршруту
    }).addTo(map);
}
    </script>
</body>
</html>
